name: Install verified Blender
description: Restore or download Blender 4.2.9 and verify its published archive checksum.
runs:
  using: composite
  steps:
    - name: Restore verified Blender archive
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: /tmp/blender.tar.xz
        key: blender-4.2.9-dfbc127a7d28f9c2175b23bf9d6701b2855f31eedfb391f9a6e60adb24572846
    - name: Verify and extract Blender
      shell: bash
      run: |
        set -euo pipefail
        version=4.2.9
        checksum=dfbc127a7d28f9c2175b23bf9d6701b2855f31eedfb391f9a6e60adb24572846
        if [ ! -f /tmp/blender.tar.xz ]; then
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender4.2/blender-${version}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
        fi
        echo "${checksum}  /tmp/blender.tar.xz" | sha256sum --check
        mkdir -p /tmp/blender
        tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
        echo /tmp/blender >> "$GITHUB_PATH"
