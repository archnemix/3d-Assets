name: Inspect industrial outpost interior

on:
  push:
    branches: ['arena/d853ac80-3d-assets']
    paths: ['automation/outpost-interior-request.json']

permissions:
  contents: write

concurrency:
  group: asset-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/arena/d853ac80-3d-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libgl1
      - uses: ./.github/actions/blender
      - name: Render additional views
        id: render
        continue-on-error: true
        run: |
          mkdir -p reports/interior/modkit-industrial-outpost
          set +e
          blender --background --factory-startup --python-exit-code 1 --python rendering/inspect_outpost.py 2>&1 | tee reports/interior/modkit-industrial-outpost/blender.log
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Commit views and log to this branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/interior/modkit-industrial-outpost
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: inspect outpost interior [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep "$attempt"
          done
          exit 1
      - name: Reflect render result
        if: steps.render.outputs.exit_code != '0'
        run: exit 1
