name: Verify MakeHuman source pack

on:
  push:
    branches: ['arena/6f1c607a-3d-assets']
    paths: ['automation/verify-makehuman.json']

permissions:
  contents: write

jobs:
  verify:
    if: github.ref == 'refs/heads/arena/6f1c607a-3d-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Download official pack and record metadata
        run: |
          mkdir -p reports/research
          set -o pipefail
          python scripts/probe_makehuman.py | tee reports/research/makehuman-download.log
      - name: Persist source evidence in the repository
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/research/makehuman-pack reports/research/makehuman-download.log
          git diff --cached --quiet || git commit -m 'research: verify MakeHuman CC0 pack [skip ci]'
          git push origin HEAD:arena/6f1c607a-3d-assets
