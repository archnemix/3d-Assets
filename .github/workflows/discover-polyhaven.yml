name: Discover realistic models
on:
  push:
    branches: ['arena/d853ac80-3d-assets']
    paths: ['automation/discover-polyhaven.json']
permissions:
  contents: write
concurrency:
  group: asset-pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Query the public API
        id: query
        continue-on-error: true
        run: |
          mkdir -p reports/research
          set +e
          python scripts/discover_polyhaven.py 2>&1 | tee reports/research/polyhaven-discovery.log
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Commit discovery and log
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/research/polyhaven-discovery.log
          if [ -f reports/research/polyhaven-unrepresented.json ]; then git add -- reports/research/polyhaven-unrepresented.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Discover unrepresented Poly Haven models [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep "$attempt"
          done
          exit 1
      - name: Reflect query result
        if: steps.query.outputs.exit_code != '0'
        run: exit 1
