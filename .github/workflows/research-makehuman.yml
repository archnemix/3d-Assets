name: Research MakeHuman source pack

on:
  push:
    branches: ['arena/6f1c607a-3d-assets']
    paths: ['automation/research-makehuman.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-pack:
    if: github.ref == 'refs/heads/arena/6f1c607a-3d-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download and describe the official CC0 pack
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p reports/research
          set -o pipefail
          python scripts/research_makehuman.py 2>&1 | tee reports/research/makehuman.log
      - name: Persist source research and logs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p reports/research
          git add -- research/makehuman-system-pack.json reports/research/makehuman.log
          if ! git diff --cached --quiet; then
            git commit -m 'research: pin MakeHuman CC0 system pack [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:arena/6f1c607a-3d-assets; then exit 0; fi
              git pull --rebase origin arena/6f1c607a-3d-assets
              sleep "$attempt"
            done
            exit 1
          fi
