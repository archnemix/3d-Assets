name: Research CC0 clothing packs
on:
  push:
    branches: ['arena/d853ac80-3d-assets']
    paths: ['.github/workflows/clothing-pack-research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    if: github.ref == 'refs/heads/arena/d853ac80-3d-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect CC0 pack archives
        run: python scripts/research_clothing_packs.py
      - name: Publish archive research
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/clothing-packs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: inspect CC0 clothing packs [skip ci]'
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep "$attempt"
          done
          exit 1
