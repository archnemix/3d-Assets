name: Inspect a candidate submarine archive
on:
  workflow_dispatch:
  push:
    branches: ["arena/d853ac80-3d-assets"]
    paths: [".github/workflows/vehicle-source-scout.yml"]
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/arena/d853ac80-3d-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: List archive and print bounded license text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full
          curl --fail --location --max-time 120 --max-filesize 1048576 --output "$RUNNER_TEMP/submarine.7z" https://opengameart.org/sites/default/files/Submarine.7z
          mkdir -p reports/research
          {
            echo 'Source: https://opengameart.org/content/submarine-low-poly'
            sha256sum "$RUNNER_TEMP/submarine.7z"
            7z l -slt "$RUNNER_TEMP/submarine.7z"
            echo '--- License files (first 16 KiB) ---'
            7z e -so -ssc- "$RUNNER_TEMP/submarine.7z" '*license*' | head -c 16384 || true
          } > reports/research/submarine-archive.txt
      - name: Publish listing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research/submarine-archive.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: submarine archive listing [skip ci]'
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep "$attempt"
          done
          exit 1
